# Скопируйте в kiosk.toml рядом с pintel-kiosk.exe
#
# Сервер и токен тут больше не настраивают. Адрес сервера и общий ключ привязки лежат в
# самой сборке, а свой токен киоск получает у сервера сам при первом выходе на связь —
# раздача токенов по точкам осталась от прежней версии, и ровно из-за неё ни одна точка не
# была подключена, а общей базы оценок не получалось. Новый киоск виден администратору в
# «Настройки → Киоски», незнакомый отключается одной кнопкой.
#
# Оставшиеся в старых файлах `token`, `sickw_key` и `sickw_services` программа молча
# пропускает — удалять их руками не нужно.
point = "Алматы-1"                         # подпись в шапке, пока сервер не ответил
apple_history_seconds = 90                 # сколько ждать «Запчасти и история обслуживания»
return_seconds = 60                        # через сколько секунд талон возвращается к началу
fullscreen = true                          # Esc — выйти из полного экрана, Ctrl+Q — закрыть
sickw = true                               # проверять по базе IMEI через сервер
# server = "https://kiosk.pintelkz.com"    # другой адрес нужен только для тестового контура
# server_key = ""                          # общий ключ привязки; меняют вместе с сервером

# --- База IMEI (Sickw) ---
# Запрос идёт через сервер: ключ живёт только там, и там же общий кэш — один и тот же IMEI
# не оплачивается дважды. ЦЕНЫ здесь нет: её считает бот Оценки по своему прайсу.
sickw_services_sealed = [147]              # запечатанный: модель, объём, цвет, активация по IMEI с коробки

# --- Реестр IMEI РФС РК (imei.rfs.gov.kz) ---
# Оба IMEI аппарата сверяются при любой оценке, ключ не нужен. Заблокирован — стоп,
# не верифицирован — предупреждение со сроком временного доступа. Из-за рубежа реестр
# может не отвечать — тогда прокси KZ.
rfs = true
rfs_proxy = ""                             # http://user:pass@host:port (пусто — напрямую)

# --- Отправка сделки в Оценку (обязательно для автономной работы) ---
# В базу Оценки с точки хода нет: порт Postgres закрыт наружу. Поэтому сделку создаёт её
# бот — он на сервере, база у него под рукой, — а приложение отдаёт ему посылку через
# Telegram: отправляет её файлом в рабочую группу, с карточкой и кнопкой. Оценщик нажимает
# кнопку, бот подставляет видео и фото, присланные по тому же коду, и создаёт сделку.
# Обработчик для бота и таблицу обмена ставить по deploy/оценка_бот/README.md.
#
# Фото и видео сдают боту: программа показывает QR со ссылкой вида
# https://t.me/<бот>?start=p<КОД>, сотрудник открывает её своим телефоном и шлёт медиа.
# Хранение бесплатное (file_id Telegram), а кто открыл ссылку — тот и оценщик сделки.
# Точку сделки бот берёт от него же: у продавца это его магазин, администратор выбирает
# её кнопкой после загрузки медиа. В настройках её задавать не нужно.
# ВИДЕО ОБЯЗАТЕЛЬНО: без него Оценка не открывает карточку сделки, и бот её не создаст.
ocenka_bot = "PintelOlxBot"        # имя бота без @ (сейчас тестовый)
ocenka_bot_token = ""              # токен того же бота: им приложение отправляет сделку
ocenka_chat_id = ""                # рабочая группа: добавьте туда бота и напишите /kiosk_id
staff_name = ""                    # имя сотрудника для чека клиенту (кто у кассы)

# --- Тест на телефоне клиента ---
# Кабель не нажмёт на экран, не послушает динамик и не посмотрит в камеру. Поэтому киоск
# держит мини-сервер в СВОЕЙ локальной сети и показывает QR: клиент открывает его тем
# телефоном, который сдаёт, и телефон сам прогоняет тесты — сетка сенсора, мультитач,
# заливка экрана цветами, звук, микрофон, снимки обеих камер. Результат возвращается в
# киоск и уходит в сделку; без него сделку отправить нельзя.
# Интернет не нужен — нужен ОБЩИЙ Wi-Fi у кассы и телефона. Если телефона в сети нет,
# сотрудник отмечает это кнопкой: сделка уйдёт на оценку человеку, автоцены не будет.
# Порт меняют только если 8765 уже занят другой программой на этом компьютере.
# ВАЖНО: при первом запуске Windows спросит разрешение брандмауэра для pintel-kiosk.exe —
# разрешить для частной сети, иначе телефон клиента не достучится и QR будет бесполезен.
phone_test_port = 8765

# --- Реквизиты в шапке чека ---
# Чек клиент уносит с собой, поэтому на нём логотип и эти строки. Пустые не печатаются.
company_name = "Pintel.kz"
company_phone = "+77472461313"
company_site = "pintelkz.taplink.kz"
company_address = ""               # пустые строки в чеке не печатаются
company_bin = ""
reference_keep = 500               # сколько обезличенных слепков держать на точке
# Оценка весит около мегабайта: слепок телефона целиком. Без уборки диск на точке
# кончится за несколько месяцев, поэтому папки в out\ старше keep_days удаляются при
# запуске. Обезличенные эталоны живут отдельно и ограничены числом (reference_keep).
keep_days = 90                     # сколько дней хранить оценки (0 — не убирать вовсе)

# --- Архив слепков ---
# Объезжать ноутбуки и собирать папки руками никто не станет, а своего сервера нет —
# поэтому слепки уходят в закрытый чат Telegram тем же ботом, что принимает сделки.
# По умолчанию уходят только ЭТАЛОНЫ: обезличенные, по 85 КБ, серийники и IMEI из них
# вычищены. Их же присылают разработчику, когда разбор ошибся.
# Нет связи — файлы подождут на диске и уедут следующей попыткой.
archive_chat_id = ""               # отдельный чат/группа для слепков (пусто — не выгружать)
archive_snapshots = false          # true — слать и ПОЛНЫЕ слепки: в них серийники и IMEI

# --- Обновление по интернету ---
# Сборки кладёт в релизы GitHub сама сборка. Программа сверяет свою метку с последним
# релизом и, если он новее, показывает на первом экране кнопку «Обновить программу».
# Сама посреди работы ничего не меняет: нажимают, когда у стойки никого нет.
# Токен нужен только на чтение: github.com → Settings → Developer settings →
# Personal access tokens → Fine-grained → этот репозиторий, Contents: Read-only.
update_repo = "AsikSoftware/TgOsint"
update_token = ""                  # пусто — обновление не проверяется
update_asset = "pintel-kiosk_Windows_x64.zip"
