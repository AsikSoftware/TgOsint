# Сборка PintelCheck под Windows — целиком, «из коробки».
#
# Что делает:
#   1. Берёт настоящую Windows-машину GitHub (у неё предустановлен MSYS2).
#   2. Ставит libimobiledevice из подписанных пакетов MSYS2.
#   3. get_bin.py раскладывает exe и все их DLL в bin/ (по таблице импорта PE).
#   4. PyInstaller собирает программу в папку dist/PintelCheck.
#   5. ДЫМОВОЙ ТЕСТ: собранный exe запускается, опрашивается по HTTP,
#      и /api/setup обязан подтвердить, что все четыре инструмента
#      libimobiledevice на месте. Без этого релиз не выкладывается.
#   6. Готовый zip уходит в Releases — скачал, распаковал, работает.
#      Единственное, что остаётся руками на точке, — драйвер Apple (iTunes).
name: Сборка Windows

on:
  workflow_dispatch:
  push:
    branches: [claude/new-session-1hqkrp]
    paths:
      - 'pintel_check/**'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: write

env:
  PYTHONUTF8: '1'

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: pintel_check
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Поставить libimobiledevice (MSYS2)
        shell: pwsh
        run: |
          $pacman = 'C:\msys64\usr\bin\pacman.exe'
          # Повторяем до трёх раз: зеркала MSYS2 изредка отваливаются.
          foreach ($i in 1..3) {
            & $pacman -Sy --noconfirm --needed mingw-w64-ucrt-x86_64-libimobiledevice
            if ($LASTEXITCODE -eq 0) { break }
            Start-Sleep -Seconds (10 * $i)
          }
          if ($LASTEXITCODE -ne 0) { throw "pacman не смог поставить пакет" }

      - name: Собрать папку bin (get_bin.py)
        run: python get_bin.py

      - name: Тесты парсера прайса
        run: python tests/test_gsheet.py

      # Пробная синхронизация с настоящей таблицей магазина. Если таблица
      # открыта по ссылке — свежий прайс попадёт прямо в дистрибутив.
      # Если нет — сборка НЕ падает, едут заглушки, и прайс обновляется
      # кнопкой в Настройках уже на точке.
      - name: Прайс из Google Таблицы (не блокирует сборку)
        continue-on-error: true
        run: python -c "import sys; sys.path.insert(0, '.'); from core import gsheet; import json; print(json.dumps(gsheet.sync(), ensure_ascii=False, indent=1))"

      - name: Собрать программу (PyInstaller + Qt)
        run: |
          python -m pip install --quiet pyinstaller pyside6 google-auth requests
          python -m PyInstaller --clean --noconfirm PintelCheck.spec

      - name: Дымовой тест собранного exe
        shell: pwsh
        run: |
          $exe = 'dist\PintelCheck\PintelCheck.exe'
          if (-not (Test-Path $exe)) { throw "exe не собрался: $exe" }
          # --selftest: окно строится без экрана, все 4 инструмента
          # libimobiledevice обязаны быть на месте внутри комплекта.
          $p = Start-Process -FilePath $exe -ArgumentList '--selftest' -PassThru -Wait `
               -RedirectStandardOutput self_out.txt -RedirectStandardError self_err.txt
          Get-Content self_out.txt, self_err.txt -ErrorAction SilentlyContinue | Write-Host
          $rep = 'dist\PintelCheck\selftest.txt'
          if (Test-Path $rep) { Get-Content $rep | Write-Host }
          if ($p.ExitCode -ne 0) { throw "selftest провален, код $($p.ExitCode)" }
          Write-Host "Дымовой тест пройден: окно строится, инструменты на месте."

      - name: Упаковать
        shell: pwsh
        run: |
          # Следы дымового теста в дистрибутив не едут
          Remove-Item -Recurse -Force dist\PintelCheck\data -ErrorAction SilentlyContinue
          Remove-Item -Force dist\PintelCheck\selftest.txt, dist\PintelCheck\app_log.txt -ErrorAction SilentlyContinue
          Compress-Archive -Path dist\PintelCheck -DestinationPath PintelCheck_Windows_x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: PintelCheck_Windows_x64
          path: pintel_check/PintelCheck_Windows_x64.zip

      - name: Выложить в Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "win-build-${{ github.run_number }}"
          gh release create $tag PintelCheck_Windows_x64.zip `
            --target $env:GITHUB_SHA `
            --title "PintelCheck для Windows — сборка #${{ github.run_number }}" `
            --notes-file "$env:GITHUB_WORKSPACE\.github\release-notes-windows.md"
