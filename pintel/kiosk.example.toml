# Скопируйте в kiosk.toml рядом с pintel-kiosk.exe
#
# Сейчас приложение работает БЕЗ нашего сервера: сделку оно создаёт в Оценке само.
# Для этого обязательны ocenka_* ниже; server и token можно оставить пустыми.
server = ""                                # адрес нашего сервера (пусто — работаем автономно)
token = ""                                 # Настройки → Киоски → Создать киоск (показывается один раз)
point = "Алматы-1"                         # подпись в шапке, пока сервер не ответил
apple_history_seconds = 90                 # сколько ждать «Запчасти и история обслуживания»
return_seconds = 60                        # через сколько секунд талон возвращается к началу
fullscreen = true                          # Esc — выйти из полного экрана, Ctrl+Q — закрыть
currency = "₸"
sickw = true                               # проверять по базе IMEI через сервер

# --- Без сервера (одна точка, проверка на месте) ---
# Если server/token пустые, киоск работает сам: прайс берёт прямо из Google
# Таблицы (gservice.json рядом с exe), чёрный список — по своему ключу Sickw.
# Оценки копятся в %LOCALAPPDATA%\PintelKiosk\queue и уйдут на сервер, когда он появится.
sickw_key = ""
sickw_services = [61]
gservice_json = "gservice.json"
price_sheet_url = "https://docs.google.com/spreadsheets/d/1TJWXvVC9eBFhKW38mfRBUvOftSUrWL_LmzsR-VlF-ZA/edit?gid=1917713663"

# --- Отправка сделки в Оценку (обязательно для автономной работы) ---
# В базу Оценки с точки хода нет: порт Postgres закрыт наружу. Поэтому сделку создаёт её
# бот — он на сервере, база у него под рукой, — а приложение отдаёт ему посылку через
# Telegram: отправляет её файлом в рабочую группу, с карточкой и кнопкой. Оценщик нажимает
# кнопку, бот подставляет видео и фото, присланные по тому же коду, и создаёт сделку.
# Обработчик для бота и таблицу обмена ставить по deploy/оценка_бот/README.md.
#
# Фото и видео сдают боту: программа показывает QR со ссылкой вида
# https://t.me/<бот>?start=p<КОД>, сотрудник открывает её своим телефоном и шлёт медиа.
# Хранение бесплатное (file_id Telegram), а кто открыл ссылку — тот и оценщик сделки.
# Точку сделки бот берёт от него же: у продавца это его магазин, администратор выбирает
# её кнопкой после загрузки медиа. В настройках её задавать не нужно.
# ВИДЕО ОБЯЗАТЕЛЬНО: без него Оценка не открывает карточку сделки, и бот её не создаст.
ocenka_bot = "PintelOlxBot"        # имя бота без @ (сейчас тестовый)
ocenka_bot_token = ""              # токен того же бота: им приложение отправляет сделку
ocenka_chat_id = ""                # рабочая группа: добавьте туда бота и напишите /kiosk_id
staff_name = ""                    # имя сотрудника для чека клиенту (кто у кассы)
reference_keep = 500               # сколько обезличенных слепков держать на точке
# Оценка весит около мегабайта: слепок телефона целиком. Без уборки диск на точке
# кончится за несколько месяцев, поэтому папки в out\ старше keep_days удаляются при
# запуске. Обезличенные эталоны живут отдельно и ограничены числом (reference_keep).
keep_days = 90                     # сколько дней хранить оценки (0 — не убирать вовсе)
