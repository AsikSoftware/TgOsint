# Сборка PintelCheck под Windows — целиком, «из коробки».
#
# Что делает:
#   1. Берёт настоящую Windows-машину GitHub (у неё предустановлен MSYS2).
#   2. Ставит libimobiledevice из подписанных пакетов MSYS2.
#   3. get_bin.py раскладывает exe и все их DLL в bin/ (по таблице импорта PE).
#   4. PyInstaller собирает программу в папку dist/PintelCheck.
#   5. ДЫМОВОЙ ТЕСТ: собранный exe запускается, опрашивается по HTTP,
#      и /api/setup обязан подтвердить, что все четыре инструмента
#      libimobiledevice на месте. Без этого релиз не выкладывается.
#   6. Готовый zip уходит в Releases — скачал, распаковал, работает.
#      Единственное, что остаётся руками на точке, — драйвер Apple (iTunes).
name: Сборка Windows

on:
  workflow_dispatch:
  push:
    branches: [claude/new-session-1hqkrp]
    paths:
      - 'pintel_check/**'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: write

env:
  PYTHONUTF8: '1'

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: pintel_check
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Поставить libimobiledevice (MSYS2)
        shell: pwsh
        run: |
          $pacman = 'C:\msys64\usr\bin\pacman.exe'
          # Повторяем до трёх раз: зеркала MSYS2 изредка отваливаются.
          foreach ($i in 1..3) {
            & $pacman -Sy --noconfirm --needed mingw-w64-ucrt-x86_64-libimobiledevice
            if ($LASTEXITCODE -eq 0) { break }
            Start-Sleep -Seconds (10 * $i)
          }
          if ($LASTEXITCODE -ne 0) { throw "pacman не смог поставить пакет" }

      - name: Собрать папку bin (get_bin.py)
        run: python get_bin.py

      - name: Собрать программу (PyInstaller)
        run: |
          python -m pip install --quiet pyinstaller
          python -m PyInstaller --clean --noconfirm PintelCheck.spec

      - name: Дымовой тест собранного exe
        shell: pwsh
        run: |
          $exe = 'dist\PintelCheck\PintelCheck.exe'
          if (-not (Test-Path $exe)) { throw "exe не собрался: $exe" }
          $p = Start-Process -FilePath $exe -ArgumentList '--no-browser' -PassThru `
               -RedirectStandardOutput app_out.txt -RedirectStandardError app_err.txt
          try {
            $ok = $false
            foreach ($i in 1..30) {
              try {
                $r = Invoke-WebRequest -UseBasicParsing 'http://127.0.0.1:8765/' -TimeoutSec 2
                if ($r.StatusCode -eq 200) { $ok = $true; break }
              } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $ok) { throw "программа не ответила на / за 30 секунд" }

            $setup = Invoke-RestMethod 'http://127.0.0.1:8765/api/setup' -TimeoutSec 10
            $tools = $setup.'пункты' | Where-Object { $_.'что' -like 'idevice*' }
            if (@($tools).Count -ne 4) { throw "в /api/setup не 4 инструмента, а $(@($tools).Count)" }
            $bad = @($tools | Where-Object { -not $_.'готово' })
            if ($bad.Count -gt 0) {
              $bad | ConvertTo-Json -Depth 5 | Write-Host
              throw "инструменты libimobiledevice не готовы внутри сборки"
            }
            Write-Host "Дымовой тест пройден: интерфейс отвечает, все 4 инструмента на месте."
          }
          finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            if (Test-Path app_out.txt) { Write-Host '--- вывод программы:'; Get-Content app_out.txt }
            if (Test-Path app_err.txt) { Get-Content app_err.txt }
          }

      - name: Упаковать
        shell: pwsh
        run: |
          # База приёмок с дымового теста в дистрибутив не едет
          Remove-Item -Recurse -Force dist\PintelCheck\data -ErrorAction SilentlyContinue
          Compress-Archive -Path dist\PintelCheck -DestinationPath PintelCheck_Windows_x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: PintelCheck_Windows_x64
          path: pintel_check/PintelCheck_Windows_x64.zip

      - name: Выложить в Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "win-build-${{ github.run_number }}"
          $notes = @"
Готовая сборка PintelCheck для Windows x64 — всё в комплекте, включая libimobiledevice.

**Установка на точке:**
1. Скачай и распакуй zip. Копируется ВСЯ папка PintelCheck, не один файл.
2. Поставь iTunes с сайта Apple (нужен его драйвер USB). Один раз.
3. Запусти PintelCheck.exe — откроется браузер.

Сборка прошла дымовой тест: программа запускалась на Windows-машине,
интерфейс и API отвечали, все 4 инструмента libimobiledevice на месте.
Прайс в prices.json — заглушки, заполнить перед работой.
"@
          gh release create $tag PintelCheck_Windows_x64.zip `
            --target $env:GITHUB_SHA `
            --title "PintelCheck для Windows — сборка #${{ github.run_number }}" `
            --notes $notes
