# Pintel Diagnostics: тесты сервера (Linux) → сборка pintel-doctor и pintel-kiosk для Windows → релиз
name: Сборка Pintel Diagnostics

on:
  workflow_dispatch:
  push:
    branches: [claude/new-session-1hqkrp]
    paths:
      - 'pintel/**'
      - '.github/workflows/build-doctor.yml'

permissions:
  contents: write

env:
  PYTHONUTF8: '1'

jobs:
  server-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pintel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Зависимости (ядро + сервер)
        run: python -m pip install --quiet -e ".[server,test]"
      - name: Тесты ядра и сервера
        run: |
          set +e
          python -m pytest tests -q --tb=short > pytest.log 2>&1
          rc=$?
          tail -n 200 pytest.log
          if [ $rc -ne 0 ]; then
            grep -E "^(FAILED|ERROR)" pytest.log | head -20 | while IFS= read -r line; do
              echo "::error::$line"
            done
            echo "::error::Тесты ядра и сервера упали (код $rc)"
          fi
          exit $rc
      - name: Миграции на чистой базе
        run: PINTEL_DATABASE_URL=sqlite:////tmp/mig.db alembic upgrade head

  build:
    runs-on: windows-latest
    needs: server-tests
    defaults:
      run:
        working-directory: pintel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Зависимости (ядро + сервер + киоск)
        run: python -m pip install --quiet -e ".[server,kiosk,test]" pyinstaller

      - name: Тесты ядра (архивные слепки — регрессия)
        run: |
          python -m pytest tests -q -s --tb=short --ignore=tests/test_server.py 2>&1 | Tee-Object -FilePath pytest.log
          $rc = $LASTEXITCODE
          if ($rc -ne 0) {
            Select-String -Path pytest.log -Pattern '^(FAILED|ERROR)' | Select-Object -First 20 |
              ForEach-Object { Write-Output "::error::$($_.Line)" }
            Write-Output "::error::Тесты ядра упали в сборке Windows (код $rc)"
          }
          exit $rc

      - name: Сборка exe
        run: python -m PyInstaller --clean --noconfirm pintel-doctor.spec

      - name: Дымовой тест exe
        shell: pwsh
        run: |
          $exe = 'dist\pintel-doctor\pintel-doctor.exe'
          & $exe selfcheck
          if ($LASTEXITCODE -ne 0) { throw "selfcheck упал" }
          # отчёт из архивного слепка через СОБРАННЫЙ exe
          python -c "import sys; sys.path.insert(0,'tests'); sys.path.insert(0,'.'); from fixtures import INVENTORIES, load_snapshot; from pintel_core.devicelink import snapshot; open('archive.snapshot.json','w',encoding='utf-8').write(snapshot.dumps(load_snapshot(INVENTORIES[-1])))"
          & $exe report archive.snapshot.json
          if ($LASTEXITCODE -ne 0) { throw "report упал" }
          Copy-Item config.example.toml dist\pintel-doctor\config.example.toml
          Copy-Item README.md dist\pintel-doctor\README.md

      - name: Упаковать доктора
        shell: pwsh
        run: Compress-Archive -Path dist\pintel-doctor -DestinationPath pintel-doctor_Windows_x64.zip

      - name: Сборка кассы (сервер одним файлом)
        run: python -m PyInstaller --clean --noconfirm pintel-server.spec

      - name: Дымовой тест кассы
        shell: pwsh
        run: |
          Copy-Item server.example.toml dist\pintel-server\server.example.toml
          Copy-Item deploy\README.md dist\pintel-server\README-VPS.md
          $exe = 'dist\pintel-server\pintel-server.exe'
          & $exe create-admin --login admin --name Admin --password admin123
          if ($LASTEXITCODE -ne 0) { throw "create-admin упал" }
          $p = Start-Process -FilePath $exe -ArgumentList 'run','--no-browser' -PassThru -WorkingDirectory 'dist\pintel-server'
          Start-Sleep -Seconds 8
          try {
            $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8000/healthz; Write-Host $r.Content
            $login = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8000/login
            $css = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8000/static/app.css
          } finally { Stop-Process -Id $p.Id -Force }
          if (-not $r -or $r.StatusCode -ne 200) { throw "касса не ответила на /healthz" }
          if ($login.StatusCode -ne 200 -or $css.StatusCode -ne 200) { throw "страница входа или стили не отдаются" }
          Remove-Item dist\pintel-server\pintel.db -ErrorAction SilentlyContinue
          Compress-Archive -Path dist\pintel-server -DestinationPath pintel-server_Windows_x64.zip

      - name: Сборка киоска
        run: python -m PyInstaller --clean --noconfirm pintel-kiosk.spec

      - name: Метка сборки
        # по ней программа понимает, что вышла новая версия, и предлагает обновиться
        # блочный скаляр: в строке есть «: », и в обычном виде YAML считает её парой ключ-значение
        run: |
          python -c "import json, io; io.open('dist/pintel-kiosk/build_info.json', 'w', encoding='utf-8').write(json.dumps({'тег': 'doctor-${{ github.run_number }}'}, ensure_ascii=False))"
          type dist\pintel-kiosk\build_info.json

      - name: Значок зашит во все три exe
        # сверка побайтно: сборка без значка тоже зелёная, а на точке у программы заглушка
        run: python tools/exe_icon.py dist\pintel-kiosk\pintel-kiosk.exe dist\pintel-doctor\pintel-doctor.exe dist\pintel-server\pintel-server.exe

      - name: Дымовой тест киоска (импорт без экрана)
        shell: pwsh
        run: |
          # Примера настроек в сборке больше нет: на точке ничего не заполняют, адрес зашит
          # в программу, токен вводят в ней самой, остальное приходит с сервера.
          $size = (Get-ChildItem dist\pintel-kiosk -Recurse | Measure-Object -Property Length -Sum).Sum / 1MB
          Write-Host ("pintel-kiosk: {0:N0} MB" -f $size)
          if (-not (Test-Path dist\pintel-kiosk\pintel-kiosk.exe)) { throw "exe киоска не собрался" }
          if (-not (Test-Path dist\pintel-kiosk\_internal\pintel_core\assets\diag.html)) { throw "в сборке нет страницы теста телефона" }
          Compress-Archive -Path dist\pintel-kiosk -DestinationPath pintel-kiosk_Windows_x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: pintel-doctor_Windows_x64
          path: pintel/pintel-doctor_Windows_x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: pintel-kiosk_Windows_x64
          path: pintel/pintel-kiosk_Windows_x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: pintel-server_Windows_x64
          path: pintel/pintel-server_Windows_x64.zip

      - name: Релиз
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "doctor-${{ github.run_number }}" pintel-doctor_Windows_x64.zip pintel-kiosk_Windows_x64.zip pintel-server_Windows_x64.zip `
            --target $env:GITHUB_SHA --title "Pintel Diagnostics — сборка #${{ github.run_number }}" `
            --notes "pintel-server: касса сотрудника одним файлом (server.toml, gservice.json рядом; пункт 2 — администратор, пункт 1 — запуск). pintel-kiosk: киоск для клиента — распаковать поверх папки программы и запустить, токен точки и настройки лежат в %LOCALAPPDATA%\PintelKiosk. pintel-doctor: консольный врач. Для всех точек — VPS, pintel/deploy."
