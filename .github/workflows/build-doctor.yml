# Pintel Diagnostics: тесты сервера (Linux) → касса для Windows → релиз → касса для мака.
# Доктор и сервер из сборок убраны (владелец, 25.11.2026): сервер работает на VPS из
# исходников, доктор нужен только при разработке. Собирается то, что едет на точки.
name: Сборка Pintel Diagnostics

on:
  workflow_dispatch:
  push:
    branches: [claude/new-session-1hqkrp]
    paths:
      - 'pintel/**'
      - '.github/workflows/build-doctor.yml'

permissions:
  contents: write

env:
  PYTHONUTF8: '1'

jobs:
  server-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pintel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Зависимости (ядро + сервер)
        run: python -m pip install --quiet -e ".[server,test]"
      - name: Тесты ядра и сервера
        timeout-minutes: 20
        run: |
          set +e
          python -m pytest tests -q --tb=short > pytest.log 2>&1
          rc=$?
          tail -n 200 pytest.log
          if [ $rc -ne 0 ]; then
            grep -E "^(FAILED|ERROR)" pytest.log | head -20 | while IFS= read -r line; do
              echo "::error::$line"
            done
            echo "::error::Тесты ядра и сервера упали (код $rc)"
          fi
          exit $rc
      - name: Миграции на чистой базе
        run: PINTEL_DATABASE_URL=sqlite:////tmp/mig.db alembic upgrade head

  build:
    runs-on: windows-latest
    needs: server-tests
    # Своих часов у сборки нет, а у GitHub лимит по умолчанию — шесть. 17.11.2026 тесты
    # зависли на Windows и сожгли все шесть, не оставив ни лога, ни подсказки.
    timeout-minutes: 50
    defaults:
      run:
        working-directory: pintel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Зависимости (ядро + сервер + киоск)
        run: python -m pip install --quiet -e ".[server,kiosk,test]" pyinstaller

      - name: Тесты ядра (архивные слепки — регрессия)
        timeout-minutes: 20
        # `faulthandler_timeout` — на случай зависания: через три минуты без движения pytest
        # печатает стек всех потоков, и видно, какой тест встал. Без этого зависший тест
        # выглядит как молчание. Лог сохраняем всегда — шаг ниже выложит его артефактом.
        run: |
          python -m pytest tests -q -s --tb=short -o faulthandler_timeout=180 --ignore=tests/test_server.py 2>&1 | Tee-Object -FilePath pytest.log
          $rc = $LASTEXITCODE
          if ($rc -ne 0) {
            Select-String -Path pytest.log -Pattern '^(FAILED|ERROR)' | Select-Object -First 20 |
              ForEach-Object { Write-Output "::error::$($_.Line)" }
            Write-Output "::error::Тесты ядра упали в сборке Windows (код $rc)"
          }
          exit $rc

      - name: Лог тестов — артефактом (даже если упало)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log-windows
          path: pintel/pytest.log
          if-no-files-found: ignore

      - name: Сборка киоска
        run: python -m PyInstaller --clean --noconfirm pintel-kiosk.spec

      - name: Метка сборки
        # по ней программа понимает, что вышла новая версия, и предлагает обновиться
        # блочный скаляр: в строке есть «: », и в обычном виде YAML считает её парой ключ-значение
        run: |
          python -c "import json, io; io.open('dist/pintel-kiosk/build_info.json', 'w', encoding='utf-8').write(json.dumps({'тег': 'doctor-${{ github.run_number }}'}, ensure_ascii=False))"
          type dist\pintel-kiosk\build_info.json

      - name: Значок зашит в exe кассы
        # сверка побайтно: сборка без значка тоже зелёная, а на точке у программы заглушка
        run: python tools/exe_icon.py dist\pintel-kiosk\pintel-kiosk.exe

      - name: Дымовой тест киоска (импорт без экрана)
        shell: pwsh
        run: |
          # Примера настроек в сборке больше нет: на точке ничего не заполняют, адрес зашит
          # в программу, токен вводят в ней самой, остальное приходит с сервера.
          $size = (Get-ChildItem dist\pintel-kiosk -Recurse | Measure-Object -Property Length -Sum).Sum / 1MB
          Write-Host ("pintel-kiosk: {0:N0} MB" -f $size)
          if (-not (Test-Path dist\pintel-kiosk\pintel-kiosk.exe)) { throw "exe киоска не собрался" }
          if (-not (Test-Path dist\pintel-kiosk\_internal\pintel_core\assets\diag.html)) { throw "в сборке нет страницы теста телефона" }
          # Самопроверка готового exe: всё ли, чем читается телефон, загружается. Тесты гоняют
          # исходники, а не exe, — сборка doctor-85 ушла на точки без чтения panic full.
          $out = Join-Path $PWD "selftest.txt"
          Remove-Item $out -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath dist\pintel-kiosk\pintel-kiosk.exe -ArgumentList "--selftest", "`"$out`"" -PassThru -Wait
          if (Test-Path $out) { Get-Content $out -Encoding UTF8 } else { Write-Host "файла с итогом самопроверки нет" }
          if ($p.ExitCode -ne 0 -or -not (Test-Path $out)) { throw "киоск не прошёл самопроверку: часть модулей связи с телефоном не загружается" }
          Remove-Item $out -ErrorAction SilentlyContinue
          Compress-Archive -Path dist\pintel-kiosk -DestinationPath pintel-kiosk_Windows_x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: pintel-kiosk_Windows_x64
          path: pintel/pintel-kiosk_Windows_x64.zip

      - name: Релиз
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "doctor-${{ github.run_number }}" pintel-kiosk_Windows_x64.zip `
            --target $env:GITHUB_SHA --title "Pintel Diagnostics — сборка #${{ github.run_number }}" `
            --notes "Касса для точки. Windows: распаковать поверх папки программы и запустить; дальше касса обновляется сама, в первую свободную минуту. Токен точки и настройки лежат в %LOCALAPPDATA%\PintelKiosk. iTunes ставить не нужно: службу Apple программа ставит сама. Мак: архив pintel-kiosk_macOS_arm64.zip приедет в этот же релиз через несколько минут, установка — pintel/deploy/КАССА_НА_МАКЕ.md. Сервер кассы живёт на VPS и из сборок убран (владелец, 25.11.2026); консольный доктор тоже — он нужен только при разработке, запускается из исходников."

  # Касса для мака: точка на маке (владелец, 25.11.2026). Отдельная работа сборки, потому
  # что программу для мака может собрать только мак. Идёт ПОСЛЕ windows-сборки: релиз
  # создаёт она, а маковский архив мы кладём в тот же релиз — касса на маке просит его по
  # своему имени (pintel_kiosk/updater.архив_этой_системы).
  build-macos:
    runs-on: macos-latest
    needs: build
    timeout-minutes: 40
    defaults:
      run:
        working-directory: pintel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Зависимости (ядро + сервер + касса)
        # Сервер тоже: тесты гоняются целиком, а в них есть и серверные — без sqlalchemy
        # работа падает на сборе тестов, не дойдя до самой сборки.
        run: python -m pip install --quiet -e ".[server,kiosk,test]" pyinstaller
      - name: Тесты на маке
        # На маке тесты гоняются целиком: окна Qt здесь настоящие, и беды, которых не видно
        # на Windows, вылезают именно тут.
        run: QT_QPA_PLATFORM=offscreen python -m pytest -q tests
      - name: Сборка кассы для мака
        run: python -m PyInstaller --clean --noconfirm pintel-kiosk.spec
      - name: Метка сборки
        # по ней программа понимает, что вышла новая версия. Лежит рядом с самой программой
        # внутри .app — там же её ищет updater.свой_тег
        run: |
          python -c "import json, io; io.open('dist/pintel-kiosk.app/Contents/MacOS/build_info.json', 'w', encoding='utf-8').write(json.dumps({'тег': 'doctor-${{ github.run_number }}'}, ensure_ascii=False))"
          cat dist/pintel-kiosk.app/Contents/MacOS/build_info.json
      - name: Дымовой тест собранной программы
        # Тесты гоняют исходники, а не собранную программу: сборка doctor-85 ушла на точки
        # без чтения panic full, и поймала это только самопроверка готового exe.
        run: |
          ./dist/pintel-kiosk.app/Contents/MacOS/pintel-kiosk --selftest "$PWD/selftest.txt"
          cat selftest.txt
          test -f dist/pintel-kiosk.app/Contents/Frameworks/PySide6/Qt/plugins/platforms/libqcocoa.dylib \
            || (echo "в сборке нет оконной части Qt для мака — программа не покажет экран" && exit 1)
          test -f dist/pintel-kiosk.app/Contents/Resources/pintel_core/assets/diag.html \
            || (echo "в сборке нет страницы теста телефона" && exit 1)
          test -f dist/pintel-kiosk.app/Contents/Resources/pintel_kiosk/assets/fonts/Inter-Medium.ttf \
            || (echo "в сборке нет шрифтов — экран кассы будет чужим" && exit 1)
          rm -f selftest.txt
      - name: Упаковать
        # ditto, а не zip: внутри .app есть ссылки на файлы, и обычный zip их портит —
        # распакованная программа не запустится.
        run: |
          ARCH=$(uname -m)
          ditto -c -k --sequesterRsrc --keepParent dist/pintel-kiosk.app "pintel-kiosk_macOS_${ARCH}.zip"
          ls -lh "pintel-kiosk_macOS_${ARCH}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: pintel-kiosk_macOS
          path: pintel/pintel-kiosk_macOS_*.zip
      - name: Положить в релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "doctor-${{ github.run_number }}" pintel-kiosk_macOS_*.zip --clobber
