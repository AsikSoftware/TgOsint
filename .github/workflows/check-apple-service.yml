name: Проверка — служба Apple ставится сама

# Только проверка: ничего не публикует, релиз не создаёт и точки не обновляет.
# Собирает одного «доктора» и проходит на чистой Windows весь путь нового ноутбука:
# скачать пакет с сервера Apple, сверить сумму и подпись, поставить, дождаться порта 27015.
# Запускается руками и когда меняется сам этот файл.
on:
  workflow_dispatch:
  push:
    branches: [claude/new-session-1hqkrp]
    paths:
      - '.github/workflows/check-apple-service.yml'

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: pintel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Зависимости (ядро)
        run: python -m pip install --quiet -e ".[test]" pyinstaller
      - name: Тесты службы Apple на Windows
        run: python -m pytest tests/test_apple_service.py -q --tb=short
      - name: Сборка доктора
        run: python -m PyInstaller --clean --noconfirm pintel-doctor.spec
      - name: Значок зашит в exe
        run: python tools/exe_icon.py dist\pintel-doctor\pintel-doctor.exe
      - name: До установки — службы нет
        shell: pwsh
        run: |
          sc.exe query "Apple Mobile Device Service"
          Write-Host "sc: код $LASTEXITCODE (1060 — службы нет)"
          & dist\pintel-doctor\pintel-doctor.exe link
          Write-Host "link: код $LASTEXITCODE"
          exit 0
      - name: Служба Apple ставится сама
        shell: pwsh
        run: |
          & dist\pintel-doctor\pintel-doctor.exe link --install
          if ($LASTEXITCODE -ne 0) { throw "служба Apple не поставилась (код $LASTEXITCODE)" }
      - name: Пакет подписан Apple
        # На точке сверяется только сумма; здесь — что файл с этой суммой действительно
        # подписан Apple. Меняете apple_service.ПАКЕТ — этот шаг обязан остаться зелёным.
        shell: pwsh
        run: |
          $msi = Join-Path $env:LOCALAPPDATA 'Pintel\apple\AppleMobileDeviceSupport64.msi'
          $s = Get-AuthenticodeSignature -LiteralPath $msi
          Write-Host "подпись: $($s.Status) | $($s.SignerCertificate.Subject)"
          Write-Host "sha256: $((Get-FileHash -Algorithm SHA256 -LiteralPath $msi).Hash)"
          if ($s.Status -ne 'Valid' -or $s.SignerCertificate.Subject -notmatch 'Apple Inc\.') { throw "пакет не подписан Apple" }
      - name: После установки — служба работает и порт отвечает
        shell: pwsh
        run: |
          sc.exe query "Apple Mobile Device Service"
          sc.exe qc "Apple Mobile Device Service"
          sc.exe qfailure "Apple Mobile Device Service"
          $mux = Test-NetConnection -ComputerName 127.0.0.1 -Port 27015 -WarningAction SilentlyContinue
          if (-not $mux.TcpTestSucceeded) { throw "порт 27015 молчит" }
          & dist\pintel-doctor\pintel-doctor.exe selfcheck
          if ($LASTEXITCODE -ne 0) { throw "selfcheck упал" }
      - name: Зависшая служба чинится без скачивания
        shell: pwsh
        run: |
          sc.exe config "Apple Mobile Device Service" start= disabled
          sc.exe stop "Apple Mobile Device Service"
          Start-Sleep -Seconds 4
          & dist\pintel-doctor\pintel-doctor.exe link
          Write-Host "link при отключённой службе: код $LASTEXITCODE (ждём 1 — нужны права)"
          & dist\pintel-doctor\pintel-doctor.exe link --install
          if ($LASTEXITCODE -ne 0) { throw "отключённая служба не починилась (код $LASTEXITCODE)" }
          $mux = Test-NetConnection -ComputerName 127.0.0.1 -Port 27015 -WarningAction SilentlyContinue
          if (-not $mux.TcpTestSucceeded) { throw "после починки порт 27015 молчит" }
      - name: Режим модема iPhone — драйвер виден, отключается и возвращается
        # Телефон с включённым режимом модема становится для Windows проводной сетью и
        # перетягивает интернет кассы (pintel_core/devicelink/tether.py). Настоящего драйвера
        # на чистой Windows нет: его служба Netaapl появляется, когда к компьютеру впервые
        # подключают такой телефон. Поэтому ставим на её место заглушку с тем же именем и
        # проверяем настоящими `sc`, что программа её видит, отключает тем же запуском, что
        # чинит связь, и умеет вернуть. Службу Apple при этом не трогает.
        shell: pwsh
        run: |
          # что видит программа — кодом возврата (10 нет, 11 включён, 12 отключён): русские
          # слова в выводе exe оболочка сборочной машины читает не в той кодировке
          function TetherSeen { python -c "import sys; from pintel_core.devicelink import tether; sys.exit({tether.НЕТ: 10, tether.ВКЛЮЧЁН: 11, tether.ОТКЛЮЧЁН: 12}[tether.драйвер()])"; return $LASTEXITCODE }
          python -c "import sys; from pintel_core.devicelink import tether; sys.exit(0 if tether.сеть_телефона() is None else 1)"
          if ($LASTEXITCODE -ne 0) { throw "ipconfig read wrong: there is no phone on this machine" }
          $before = TetherSeen
          Write-Host "tether driver after the Apple package install: code $before (10 none, 11 enabled, 12 disabled)"
          $stub = $false
          if ($before -eq 10) {
            sc.exe create Netaapl binPath= "C:\Windows\System32\drivers\null.sys" type= kernel start= demand
            if ($LASTEXITCODE -ne 0) { throw "stub driver service was not created" }
            $stub = $true
          } else {
            & dist\pintel-doctor\pintel-doctor.exe --apple-setup --modem-on
          }
          if ((TetherSeen) -ne 11) { throw "an enabled tether driver is not seen by the program" }
          & dist\pintel-doctor\pintel-doctor.exe link --install
          if ($LASTEXITCODE -ne 0) { throw "link --install failed (code $LASTEXITCODE)" }
          sc.exe qc Netaapl
          if ((sc.exe qc Netaapl | Out-String) -notmatch 'DISABLED') { throw "tether driver is not disabled" }
          if ((TetherSeen) -ne 12) { throw "a disabled tether driver is not seen by the program" }
          $mux = Test-NetConnection -ComputerName 127.0.0.1 -Port 27015 -WarningAction SilentlyContinue
          if (-not $mux.TcpTestSucceeded) { throw "Apple service went silent after the tether switch-off" }
          & dist\pintel-doctor\pintel-doctor.exe --apple-setup --modem-on
          if ((sc.exe qc Netaapl | Out-String) -notmatch 'DEMAND_START') { throw "tether driver was not restored" }
          & dist\pintel-doctor\pintel-doctor.exe --apple-setup --modem-off
          if ((sc.exe qc Netaapl | Out-String) -notmatch 'DISABLED') { throw "second switch-off did not work" }
          if ($stub) { sc.exe delete Netaapl }
          Write-Host "tether driver: seen, disabled, restored - ok"
